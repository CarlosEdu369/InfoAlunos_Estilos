<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>popover</title>
</head>

<body>
    <main>
        <div class="wrapper">
            <article class="flow">
                <button id="popover" popovertarget="my-popover">Abrir Popover</button>
            </article>
        </div>
    </main>
    <div popover id="my-popover" class="box_flow">
        <h2>Isto é um popover!</h2>
        <button id="my_popover" popovertarget="my-popover" popovertargetaction="hide">Fechar Popover</button>
    </div>
</body>
<style>
    #popover {
        height: 50px;
        width: 90px;
        border: solid orange 2px;
        border-radius: 5px;
    }
#popover:hover{
    height: 50px;
        width: 90px;
        border: solid orange 2px;
        border-radius: 5px;
        background-color:rgb(211, 221, 228);
        cursor:pointer;
}
    .box_flow {
        border-radius: 5px;
        border: solid 1px blue;
        height: 130px;
        width: 250px;
        justify-content: bottom;
        text-align: center;
    }

    #my_popover {
        height: 50px;
        width: 100px;
        text-align: center;
        margin-left: auto;
        background-color: lightskyblue;
        border-radius: 5px;
    }
    #my_popover:hover{
         height: 50px;
        width: 100px;
        text-align: center;
        margin-left: auto;
        background-color: rgb(164, 206, 236);
        border-radius: 5px;
        cursor:pointer
    }

</style>

</html>
