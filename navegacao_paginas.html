<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagination</title>
</head>
<body>
    <div class="navegar">
    <nav aria-label="Page navigation example">
 <ul class="pagination">
 <ol class="page-item">
 <a class="page-link" href="#" aria-label="Previous">
 <span aria-hidden="true">&laquo;</span>
 </a>
 </ol>
 <ol class ="page-item"><a class ="page-link" href="#">1</a></ol>
 <ol class ="page-item active" aria-current="page">
 <a class ="page-link" href="#">2</a>
 </ol>
 <ol class ="page-item"><a class="page-link" href="#">3</a></ol>
 <ol class="page-item">
 <a class="page-link" href="#" aria-label="Next">
 <span aria-hidden="true">&raquo;</span>
 </a>
 </ol>
 </ul>
</nav>
</div>
</body>
<style>
    .navegar{
    display:flex;
    }
    .pagination{
        display:flex;
        align-items: center;
        border:solid 2px;
        width:300px;
        border-radius:3px;
        height:30px;
        background-color: lightgrey;
    }
    .page-link{
        background-color:white;
    }
</style>
</html>
