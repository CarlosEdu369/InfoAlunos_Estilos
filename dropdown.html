<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dropdown</title>
</head>

<body>
    <nav>
        <button id="anchor" popoveraction="toggle" popovertarget="target">
            Menu Dropdown ▼ 
        </button>
        <ul id="target" popover>
            <li><a href="#">Link 1</a></li>
            <li><a href="#">Link 2</a></li>
            <li><a href="#">Link 3</a></li>
        </ul>
    </nav>

</body>

<style>
    body{
        padding:10px;
    }
    ul[popover] {
        margin: 0px;
        border:0px solid;
        border-radius:5px ;
        padding:10px;
        align-content: center;
        text-align: center;
        box-shadow: 0px 10px 15px grey;
    }

    #anchor {
        anchor-name: --toggle;
        border-radius:5px;
        border:0px;
        background-color: lightgrey;
        height:30px;
        width:150px;
        padding:0px;
        margin:0px;

    }

    #target {
        position: center;
        position-anchor: --toggle;
        position-area: bottom;
        position-try-fallbacks: center;
        width: anchor-size(width);
    }
</style>

</html>
