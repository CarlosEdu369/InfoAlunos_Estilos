<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título</title>
</head>

<body>
    <div class="container">
        <div class="login">
            <img src="logo_uma_branco.png">
            <a id="site">Infoalunos.uma.pt</a>
            <div class="alinhamento">
                <label>Email</label>
                <input id="email" type="email"  class="form-control"placeholder="Insira o seu email">
                <label>Password</label>
                <input id="password" type="password" class="form-control" placeholder="Insira a sua Password">
            </div>
            
            <button class="botao"> Entrar </button>
        </div>
    </div>
</body>

<style>
    body {
        margin: 0px;
    }
    img{
        align-items: center;
        justify-content: center;
        margin-left:auto;
        margin-right:auto;
        height:100px
    }
    #email {
        max-width: 300px;
        height: 25px;
        border: 1px;
        border-radius: 2px;
        padding: 5px;
        grid-area:log;
    
    }

    #password {
        max-width: 300px;
        height: 25px;
        border: 1px;
        border-radius: 2px;
        padding: 5px;
        border-bottom-color: black;
        grid-area:pass;
        
    }

    .botao{
        width: 310px;
        height:30px;
        background-color:rgb(32, 112, 165) ;
        color:white;
        border:2px solid white;;
        padding:0px;
        margin:0px;
        border-color:white;
    }
    .botao:hover{
        width:310px;
        height:30px;
        background-color:white ;
        color:rgb(32, 112, 165);
        border:2px solid white;;
        padding:0px;
        margin:0px;
        border-color:white;
        cursor:pointer;
    }
    .container {
        background-color: white;
        height: 100vh;
        padding: 10px;
        justify-content: center;
        align-items: center;
        display: flex;
    }

    .login {
        background-color: rgb(32, 112, 165);
        height: 500px;
        width: 750px;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 10px;
        color: white;
        font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
        display: grid;
    }
    .alinhamento{
        gap:10px;
        display:grid;
        grid-template-areas:"log""pass" ;
        grid-template-areas: ".""log"
                             ".""pass";
    }
    label{
        text-align: start;
    }
    #site{
        font-size:40px;
    }
    :root {

        --cor-primaria: rgb(32, 112, 165);
        --cor-secundária: lightslategray;
        --cor-aceite: green;
        --cor-erro: red;
        --cor-aviso: yellow;
        --cor-info: lightblue;
        --cor-claro: white;
        --cor-escuro: black;
    }

    .button.primaria {
        background-color: var(--cor-primaria);
    }

    .button.secundaria {
        background-color: var(--cor-secundária);
    }

    .button.aceite {
        background-color: var(--cor-aceite);
    }

    .button.erro {
        background-color: var(--cor-erro);
    }

    .button.aviso {
        background-color: var(--cor-aviso);
    }

    .button.info {
        background-color: var(--cor-info);
    }

    .button.claro {
        background-color: var(--cor-claro);
    }

    .button.escuro {
        background-color: var(--cor-escuro);
        color:white;
    }
</style>

</html>
